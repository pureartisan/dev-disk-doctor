name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  bundle:
    # The release attaches an offline-installable bundle; make sure it still builds and runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - name: Install the bundle with the npm registry unreachable
        run: |
          npm install -g --prefix "$RUNNER_TEMP/prefix" --cache "$RUNNER_TEMP/cache" \
            --registry http://127.0.0.1:9 --fetch-retries=0 ./release/dev-disk-doctor-*.tgz
          "$RUNNER_TEMP/prefix/bin/dev-disk-doctor" --version

  automerge-dependabot:
    # Merges Dependabot minor/patch bumps once every test job has passed. Major bumps are left open.
    needs: [test]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge updates that contain no major bumps
        if: steps.metadata.outputs.dependency-names != '' && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.updateType, 'version-update:semver-major')
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
